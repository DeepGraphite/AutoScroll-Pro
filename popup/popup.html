<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoScroll Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-gradient"></div>
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3L7.5 8H11V12H13V8H16.5L12 3Z" fill="white"/>
              <path d="M12 21L16.5 16H13V12H11V16H7.5L12 21Z" fill="rgba(255,255,255,0.7)"/>
            </svg>
          </div>
          <div class="logo-text">
            <span class="logo-name">AutoScroll Pro</span>
            <span class="logo-tag">Free · v1.0</span>
          </div>
        </div>
        <div class="status-pill" id="status-badge">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Stopped</span>
        </div>
      </div>
    </header>

    <!-- Body -->
    <div class="body">

      <!-- Show Widget Button -->
      <div class="section">
        <button class="main-btn" id="toggle-widget-btn">
          <span class="btn-icon">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 8v8M9 11l3-3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span id="widget-btn-text">Show widget on page</span>
          <span class="btn-arrow">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
        </button>
      </div>

      <!-- Quick Controls -->
      <div class="section">
        <div class="section-label">Quick Controls</div>
        <div class="quick-controls">
          <button class="ctrl-btn" id="scroll-toggle-btn">
            <span class="ctrl-icon" id="toggle-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
                <polygon points="10,8 17,12 10,16" fill="currentColor"/>
              </svg>
            </span>
            <span id="scroll-toggle-text">Start</span>
          </button>
          <button class="ctrl-btn" id="direction-btn">
            <span class="ctrl-icon" id="direction-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 19V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M8 15l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span id="direction-text">Downward</span>
          </button>
        </div>
      </div>

      <!-- Speed Control -->
      <div class="section">
        <div class="section-label">
          <span>Scroll Speed</span>
          <div class="speed-input-wrap">
            <input type="number" id="speed-number" min="1" max="30" value="3" class="speed-number-input" />
            <span class="speed-unit">px/frame</span>
          </div>
        </div>
        <div class="slider-wrap">
          <input type="range" id="speed-slider" min="1" max="30" value="3" class="slider" />
          <div class="slider-labels">
            <span>1 — Slow</span>
            <span>15</span>
            <span>30 — Fast</span>
          </div>
        </div>
        <div class="preset-row">
          <button class="preset-btn" data-speed="2">
            <svg viewBox="0 0 24 24" fill="none"><path d="M13 3L5 13h6l-2 8 8-10h-6l2-8z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Slow·2
          </button>
          <button class="preset-btn" data-speed="5">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M15 7l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Normal·5
          </button>
          <button class="preset-btn" data-speed="12">
            <svg viewBox="0 0 24 24" fill="none"><path d="M13 2l3.5 7 7.5 1-5.5 5.3 1.3 7.7L13 20l-6.8 3 1.3-7.7L2 10l7.5-1L13 2z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Fast·12
          </button>
          <button class="preset-btn" data-speed="25">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M5 6h14M5 18h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Turbo·25
          </button>
        </div>
      </div>

      <!-- Mouse Sensitivity -->
      <div class="section">
        <div class="section-label">
          <span>Stop Sensitivity</span>
          <span class="value-badge amber" id="threshold-display">60px</span>
        </div>
        <div class="slider-wrap">
          <input type="range" id="threshold-slider" min="20" max="200" value="60" step="10" class="slider amber-slider" />
          <div class="slider-labels">
            <span>Very sensitive</span>
            <span>Normal</span>
            <span>Less</span>
          </div>
        </div>
        <div class="info-card">
          <svg viewBox="0 0 24 24" fill="none" class="info-icon">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Move mouse left or right to stop auto-scrolling</span>
        </div>
      </div>

      <!-- Always Show -->
      <div class="section last-section">
        <div class="toggle-row">
          <div class="toggle-info">
            <div class="toggle-title">Always show widget</div>
            <div class="toggle-desc">Display scroll icon on every page automatically</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="always-show-toggle" />
            <span class="toggle-knob"></span>
          </label>
        </div>
      </div>

    </div><!-- /body -->

    <footer class="footer">
      <svg viewBox="0 0 24 24" fill="none" class="footer-icon">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 12h8M12 8l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      AutoScroll Pro · by DeepGraphite
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
